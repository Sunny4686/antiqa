{% extends "base.html" %}
{% block title %}Inställningar · Fyndjakt{% endblock %}
{% block content %}
<h1>Inställningar</h1>
{% if sparat %}<p class="done">Sparat.</p>{% endif %}
<form class="grid" method="post" action="/installningar">
  {% for name, (label, kind) in fields.items() %}
  <label for="{{ name }}">{{ label }}</label>
  <input id="{{ name }}" name="{{ name }}" value="{{ s[name]|join(', ') if kind == 'list' else s[name] }}">
  {% endfor %}
  <span></span><button type="submit">Spara</button>
</form>
{% endblock %}
